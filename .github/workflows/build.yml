name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug --no-daemon

      - name: Rename APK to VoilarM.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk VoilarM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoilarM-APK
          path: VoilarM.apk

      - name: Publish VoilarM.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta
          name: VoilarM v1.1.0-beta
          body: |
            Direct Android APK download for VoilarM v1.1.0-beta.
            Tap VoilarM.apk below to download and install on Android (tap "More details -> Install anyway" if Play Protect prompts).
            Uninstall the old v1.0.0-beta build once before installing this update.
          files: VoilarM.apk
